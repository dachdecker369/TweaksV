; SPDX-License-Identifier: GPL-3.0-only
; ============================================================================
; TweaksV.ini for the test suites: layout 4 with the values the suites assert,
; HEAP_SIZE 1024 and PACKFILEARRAY_SIZE 12000 (the originals' defaults, not
; TweaksV's), which proves that the file is read. fresh_ini (common.sh) copies
; it with CRLF line endings and sets ERROR_POPUP=0.
; ============================================================================

[TWEAKSV]
ENABLED=1
LOG=1
DIAGNOSTIC_MODE=0
DRY_RUN=0
CONSOLE=0
ERROR_POPUP=1
CONFLICT_CHECK=1
VERSION=4

[HEAP_ADJUSTER]
ENABLED=1
HEAP_SIZE=1024

[MODKIT_LIMIT]
ENABLED=1
MODKITARRAY_SIZE=65536

[PACKFILE_LIMIT]
ENABLED=1
PACKFILEARRAY_SIZE=12000

[BOXSTREAMER]
ENABLED=1
TRAVERSAL_LIST_SIZE=10000

[DECALS]
ENABLED=1
DECALDEFS_SIZE=2048

[RAGEOPENV]
ENABLED=1
MODS_FOLDER=1
OPEN_RPF=1
SKIP_RPF_CACHE_CHECK=1

[STRAIGHTTOSTORYMODE]
ENABLED=1
SKIP_SPLASH_SCREEN=1
SKIP_LEGAL_SCREEN=1
SKIP_LANDING_PAGE=1

[DIRECTSTORAGE]
ENABLED=1
UNLOCK_FILES=1

[BLIPS]
ENABLED=1
ACTIVE_BLIP_LIMIT=1900

[WEAPON_LIMITS]
ENABLED=1
WEAPON_INFO_FILES=1024
WEAPON_COMPONENTS_SIZE=1024

[PEDPROPS]
ENABLED=1

[RESOURCES]
ENABLED=1
VIDEO_MEMORY_BUDGET=0

[STATICBOUNDS]
ENABLED=1
STATICBOUNDS_SIZE=16000

[RAYTRACING]
ENABLED=1
DYNAMIC_BVH_VERTICES=0
