; =================================================================================
; TweaksV.asi Configuration File (GTA V Enhanced)
; 1 = on, 0 = off ('true'/'false' also work)
; TweaksV.ini in game directory always takes priority over %LOCALAPPDATA%\TweaksV\
; Delete this file to get a fresh one with default values on next game launch
; Missing settings are added back automatically with the default values
; More details on what each setting does can be found in the "README.md"
; =================================================================================

[TWEAKSV]
ENABLED=1
LOG=1                           //Writes to TweaksV.log
DIAGNOSTIC_MODE=0               //TESTING ONLY: logs patterns, sites and measurements
DRY_RUN=0                       //TESTING ONLY: turns off game patching
CONSOLE=0                       //Shows a console window with the log while the game is running
ERROR_POPUP=1                   //Shows error message popups
CONFLICT_CHECK=1                //Turns off TweaksV modules while other duplicate plugins are installed
VERSION=5                       //This file's version - LEAVE THIS ALONE!

[HEAP_ADJUSTER]
ENABLED=1
HEAP_SIZE=2000                  //Heap size in MB - Maximum 2047
POOL_MEMORY=256                 //Memory budget of game pools in MB - Maximum 2047

[MODKIT_LIMIT]
ENABLED=1
MODKITARRAY_SIZE=65536          //Number of modkit IDs - Maximum 65536

[PACKFILE_LIMIT]
ENABLED=1
PACKFILEARRAY_SIZE=13000        //Number of archives - Maximum 32770

[BOXSTREAMER]
ENABLED=1
TRAVERSAL_LIST_SIZE=10000       //Number of map boxes - Maximum 100000

[DECALS]
ENABLED=1
DECALDEFS_SIZE=2048             //Number of decal definitions - Maximum 16384

[RAGEOPENV]
ENABLED=1
MODS_FOLDER=1                   //Loads "mods" folder in game directory
OPEN_RPF=1                      //Allows loading unencrypted ("OPEN") RPF archives
SKIP_RPF_CACHE_CHECK=1          //Skips game RPF cache check

[STRAIGHTTOSTORYMODE]
ENABLED=1
SKIP_SPLASH_SCREEN=1            //Skips Splash Screen
SKIP_LEGAL_SCREEN=1             //Skips Legal Screen
SKIP_LANDING_PAGE=1             //Skips Landing Page

[DIRECTSTORAGE]
ENABLED=1
UNLOCK_FILES=1                  //Keeps game directory files writable - not .rpf & .cache

[BLIPS]
ENABLED=1
ACTIVE_BLIP_LIMIT=1900          //Number of map blips before game stops adding its own - Maximum 1997

[WEAPON_LIMITS]
ENABLED=1
WEAPON_INFO_FILES=1024          //Number of weapons.meta files - Maximum 16384
WEAPON_COMPONENTS_SIZE=1024     //Number of weapon component definitions - Maximum 16384

[PEDPROPS]
ENABLED=0                       //HIGHLY EXPERIMENTAL & UNTESTED - USE AT YOUR OWN RISK!!!

[RESOURCES]
ENABLED=1
VIDEO_MEMORY_BUDGET=6000        //Video memory of streamed textures in MB - Maximum 16384 (0 = game controlled)
STREAMED_OBJECTS=131072         //Most streamed textures and buffers - Maximum 147456 (0 = game controlled)

[RAYTRACING]
ENABLED=1
DYNAMIC_BVH_VERTICES=0          //Ray tracing buffer of moving objects in vertices - Maximum 26843545 (0 = game controlled)

[LIGHTCAPACITY]
ENABLED=1
CORONA_STORE=4096               //Number of coronas a single frame holds - Maximum 8192 (1088 = game controlled)

[SIRENSETTINGS]
ENABLED=1
LARGE_SIREN_IDS=1               //Allows siren setting IDs up to 65535
SIRENS_PER_VEHICLE=32           //Number of siren lights per vehicle - Maximum 32 (20 = game controlled)

[STATICBOUNDS]
ENABLED=1
STATICBOUNDS_SIZE=16000         //Number of static collision bounds - Maximum 32767
